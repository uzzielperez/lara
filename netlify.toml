[build]
  # Safe for real users: never force-reset the database.
  command = "npm ci && node scripts/prepare-db.js && npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20.19.5"
  # Required in Netlify UI (not committed):
  # DATABASE_URL, GROQ_API_KEY, AUTH_SECRET, AUTH_URL
  # GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET (if using Google OAuth)
